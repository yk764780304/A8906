<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #fff0f4;
  --primary: #ff6b9e;
  --primary-light: #ff8fb3;
  --yellow: #ffd266;
  --green: #73d089;
  --rose: #f26288;
  --text: #5c3a41;
  --text-light: #a88b92;
  --muted: #b59aa3;
  --card-bg: #ffffff;
  --shadow: 0 6px 20px rgba(255, 107, 158, 0.12);
}
body {
  background: #f7f7f7;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif, "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", emoji;
  display: flex; justify-content: center; align-items: center; min-height: 100vh;
  touch-action: manipulation;
  -ms-touch-action: manipulation;
}
.phone {
  width: 460px; min-height: 812px; height: 900px; background: var(--bg);
  border-radius: 40px; box-shadow: 0 25px 60px rgba(0,0,0,0.15);
  overflow: hidden; display: flex; position: relative;
}
.sidebar {
  width: 74px; background: linear-gradient(180deg, #fff5f8 0%, #fff0f4 100%);
  padding: 22px 8px 20px; display: flex; flex-direction: column; align-items: center;
  gap: 12px; border-right: 1px solid rgba(255, 107, 158, 0.08);
}
.user-avatar {
  width: 48px; height: 48px; background: #fff; border-radius: 16px;
  box-shadow: 0 4px 12px rgba(255, 107, 158, 0.15);
  display: flex; align-items: center; justify-content: center; margin-bottom: 6px;
}
.menu-item {
  width: 58px; height: 58px; background: #fff; border-radius: 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; box-shadow: 0 3px 10px rgba(255, 107, 158, 0.08); position: relative;
  cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; user-select: none;
}
.menu-item:active { transform: scale(0.94); }
.menu-item.active { border: 2.5px solid var(--primary); box-shadow: 0 4px 14px rgba(255, 107, 158, 0.22); }
.menu-item.active::before {
  content: ''; position: absolute; left: -11px; top: 50%; transform: translateY(-50%);
  width: 4px; height: 24px; background: var(--primary); border-radius: 0 4px 4px 0;
}
.menu-label { font-size: 11px; color: var(--text); font-weight: 500; }

/* ===== 问候卡（仅桌面，双击自定义） ===== */

/* ===== 每日好句卡片 ===== */

/* ===== 今日待办 ===== */
.todo-list { display: flex; flex-direction: column; gap: 10px; }

}

/* ===== 通用：滑动删除 + 长按编辑 ===== */

}

/* 通用字段/按钮 */

.plan-list { display: flex; flex-direction: column; gap: 10px; }

.plan-item.struck .plan-body .title-text { opacity: 0.45; color: var(--text-light); }
.plan-item.struck .plan-body .title-text::before, .plan-item.struck .plan-body .title-text::after { content: ''; position: absolute; left: 0; right: 0; border-top: 2px solid var(--text-light); }

.sum-item { flex: 1; background: linear-gradient(135deg,#fff 0%,#fff4f9 100%); border-radius: 18px; padding: 12px 8px; text-align: center; box-shadow: 0 3px 10px rgba(255,107,158,0.08); }
.sum-item .s-label { font-size: 12px; color: var(--text-light); font-weight: 600; }

.mini-label { font-size: 12px; color: var(--text-light); font-weight: 600; margin-bottom: 6px; }
.list-card { display: flex; flex-direction: column; gap: 10px; }
#billScroll { max-height: 300px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

.lrow { background: #fff; border-radius: 16px; padding: 11px 13px; display: flex; align-items: center; gap: 10px; box-shadow: 0 3px 10px rgba(255,107,158,0.06); }

.bill-sum { font-size: 13px; color: var(--text-light); padding: 9px 12px; margin-bottom: 8px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(255,107,158,0.08); }

.progress { height: 12px; border-radius: 10px; background: #ffe3ee; overflow: hidden; margin-top: 6px; }

.piggy-foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-light); margin-top: 6px; }

.baby-info .b-meta { font-size: 13px; color: var(--text-light); margin-top: 4px; }
.baby-info .b-tip { font-size: 11px; color: var(--primary); margin-top: 4px; }
.sub-tabs { display: flex; gap: 6px; background: #fff0f4; border-radius: 16px; padding: 4px; margin-bottom: 14px; }
.sub-tab { flex: 1; text-align: center; padding: 9px 2px; border-radius: 13px; font-size: 13px; font-weight: 600; color: var(--text-light); cursor: pointer; user-select: none; }
.sub-tab.sel { background: #fff; color: var(--primary); box-shadow: 0 2px 8px rgba(255,107,158,0.15); }
.food-scroll { overflow: hidden; }
.food-bar { display: flex; gap: 4px; width: 100%; transition: transform .28s ease, opacity .25s ease; will-change: transform; }
.food-cell { flex: 1 1 0; min-width: 0; background: #fff; border: 1.5px solid transparent; border-radius: 12px; padding: 7px 0 6px; text-align: center; cursor: pointer; box-shadow: 0 2px 8px rgba(255,107,158,0.08); }
.food-cell .wd { font-size: 10px; color: var(--text-light); line-height: 1.2; }
.food-cell .dn { font-size: 14px; font-weight: 700; color: var(--text); margin-top: 1px; line-height: 1.2; }
.food-cell.today { background: #fff0f6; }
.food-cell.today .dn { color: var(--primary); }
.food-cell.sel { border-color: var(--primary); background: #ffe9f1; }
.food-cell.has .dn::after { content: ''; display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--rose); margin: 3px auto 0; }
.food-list { display: flex; flex-direction: column; gap: 9px; }
.meal-item { background: #fff; border-radius: 16px; padding: 11px 13px; box-shadow: 0 3px 10px rgba(255,107,158,0.06); position: relative; }
.meal-item .m-head { display: flex; align-items: center; gap: 8px; }
.meal-item .m-meal { font-size: 14px; font-weight: 800; color: var(--primary); }
.meal-item .m-time { font-size: 12px; color: var(--text-light); }
.meal-item .m-x { margin-left: auto; color: #d4b8c0; cursor: pointer; padding: 2px; }
.meal-item .m-food { font-size: 14px; color: var(--text); margin-top: 6px; font-weight: 600; }
.m-moves { margin-left: auto; display: flex; gap: 8px; }
.m-move { font-size: 13px; color: var(--primary); cursor: pointer; user-select: none; padding: 0 3px; line-height: 1; }
.meal-item .m-method { font-size: 12px; color: var(--text-light); margin-top: 3px; }
.note-area { width: 100%; border: 1.5px solid #ffe0eb; border-radius: 14px; padding: 10px 12px; font-size: 13px; color: var(--text); font-family: inherit; outline: none; resize: none; min-height: 60px; }

/* ===== 通用列表/倒数 ===== */
.count-card { background: linear-gradient(135deg,#fff 0%,#fff4f9 100%); border-radius: 22px; padding: 13px 14px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); }
.count-card .cc-emoji { font-size: 26px; flex-shrink: 0; }
.count-card .cc-main { flex: 1; min-width: 0; }
.count-card .cc-name { font-size: 16px; font-weight: 800; color: var(--text); word-break: break-word; }
.count-card .cc-sub { font-size: 12px; color: var(--text-light); margin-top: 3px; }
.count-card .cc-num { text-align: center; flex-shrink: 0; white-space: nowrap; min-width: 70px; }
.count-card .cc-num b { font-size: 24px; font-weight: 800; display: block; line-height: 1.05; }
.count-card .cc-num span { font-size: 11px; color: var(--text-light); }
.count-card .cc-x { color: #d4b8c0; cursor: pointer; align-self: flex-start; flex-shrink: 0; padding: 2px; }
.think-card { background: #fff; border-radius: 22px; padding: 0; box-shadow: var(--shadow); overflow: hidden; }
.think-head { display: flex; align-items: center; gap: 10px; padding: 13px 15px; cursor: pointer; user-select: none; }
.think-head .t-title { font-size: 16px; font-weight: 800; color: var(--text); }
.think-head .t-date { font-size: 12px; color: var(--text-light); margin-left: 8px; }
.think-head .t-chev { margin-left: auto; color: var(--primary); transition: transform .2s ease; }
.think-card.open .t-chev { transform: rotate(180deg); }
.think-body { padding: 0 15px 14px; font-size: 14px; color: var(--text); line-height: 1.6; white-space: pre-wrap; }
.think-body .t-x { color: #d4b8c0; cursor: pointer; float: right; }

/* 备份区 */
.backup-box { width: 100%; border: 1.5px dashed #ffd1e3; border-radius: 14px; padding: 10px; font-size: 12px; color: var(--text-light); background: #fff; font-family: monospace; resize: none; min-height: 90px; }
.ctrl-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #f3e3e9; }
.ctrl-row:last-child { border-bottom: none; }
.ctrl-row .c-label { font-size: 14px; color: var(--text); font-weight: 600; }
.switch { width: 46px; height: 26px; border-radius: 14px; background: #e7d3db; position: relative; cursor: pointer; transition: background .15s; flex-shrink: 0; }
.switch.on { background: var(--primary); }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch.on::after { left: 23px; }

.placeholder { text-align: center; padding: 50px 20px; }
.placeholder p { color: var(--text); font-weight: 700; font-size: 17px; margin-top: 16px; }
.placeholder span { color: var(--text-light); font-size: 13px; display: block; margin-top: 8px; }

/* 通用表单弹窗字段 */
.form-field { margin-bottom: 12px; }
.form-field label { display: block; font-size: 12px; color: var(--text-light); font-weight: 600; margin-bottom: 6px; }
.form-field input, .form-field select, .form-field textarea { width: 100%; border: 1.5px solid #ffe0eb; border-radius: 14px; padding: 11px 12px; font-size: 14px; color: var(--text); font-family: inherit; outline: none; background: #fff; }
.form-field textarea { resize: none; min-height: 70px; }
.form-stepper { display: flex; align-items: center; gap: 12px; justify-content: center; }
.form-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 8px; }

/* ===== 夜间主题 ===== */
body[data-theme="night"] { background: #2b2330; }
body[data-theme="night"] .phone { background: #34293a; box-shadow: 0 25px 60px rgba(0,0,0,0.45); }
body[data-theme="night"] .sidebar { background: linear-gradient(180deg,#3a2f40 0%,#34293a 100%); border-right-color: rgba(255,107,158,0.18); }
body[data-theme="night"] { --bg:#34293a; --card-bg:#43384a; --text:#ffe6ef; --text-light:#c6a3b0; --shadow:0 6px 20px rgba(0,0,0,0.3); }
body[data-theme="night"] .card, body[data-theme="night"] .collapse, body[data-theme="night"] .collapse.open,
body[data-theme="night"] .greeting-card, body[data-theme="night"] .time-card, body[data-theme="night"] .quote-card,
body[data-theme="night"] .todo-body, body[data-theme="night"] .plan-body, body[data-theme="night"] .swipe-body,
body[data-theme="night"] .lrow, body[data-theme="night"] .sum-item, body[data-theme="night"] .count-card,
body[data-theme="night"] .think-card, body[data-theme="night"] .meal-item, body[data-theme="night"] .empty-box,
body[data-theme="night"] .input-box, body[data-theme="night"] .region-input, body[data-theme="night"] .form-input,
body[data-theme="night"] .backup-box, body[data-theme="night"] .modal, body[data-theme="night"] .opt-chip,
body[data-theme="night"] .chip, body[data-theme="night"] .week-cell, body[data-theme="night"] .food-cell,
body[data-theme="night"] .edit-input, body[data-theme="night"] .note-area { background: #43384a; color: #ffe6ef; }
body[data-theme="night"] .menu-item, body[data-theme="night"] .user-avatar { background: #4a3e52; }
body[data-theme="night"] .swipe-body, body[data-theme="night"] .todo-body, body[data-theme="night"] .plan-body, body[data-theme="night"] .lrow { background: #4a3e52; }
body[data-theme="night"] .quote-card { background: linear-gradient(135deg,#43384a 0%,#3a2f40 100%); }
body[data-theme="night"] .sum-item { background: linear-gradient(135deg,#43384a 0%,#3a2f40 100%); }
body[data-theme="night"] .greeting-card, body[data-theme="night"] .time-card { background: linear-gradient(135deg,#43384a 0%,#3a2f40 55%,#382d3e 100%); }
body[data-theme="night"] .swipe-del { background: #c44a6e; }
body[data-theme="night"] .switch { background: #5a4a60; }

/* ===== 撤销提示 ===== */
.undo-toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: rgba(92,58,65,0.94); color: #fff; border-radius: 16px; padding: 10px 12px; display: none; align-items: center; gap: 12px; z-index: 80; box-shadow: 0 10px 30px rgba(0,0,0,0.3); font-size: 13px; max-width: 320px; }
.undo-toast .u-undo { background: var(--primary); color: #fff; border: none; border-radius: 10px; padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; flex-shrink: 0; }
.undo-toast .u-undo:active { transform: scale(0.94); }

/* ===== 搜索框 ===== */
.search-box { display: flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid #ffe0eb; border-radius: 14px; padding: 8px 12px; margin-bottom: 10px; }
.search-box svg { flex-shrink: 0; }
.search-box input { flex: 1; border: none; outline: none; font-size: 13px; color: var(--text); font-family: inherit; background: transparent; }

/* ===== 饼图图例 / 评估标记 ===== */
.pie-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; font-size: 12px; color: var(--text-light); }
.pie-legend .pl { display: flex; align-items: center; gap: 5px; }
.pie-legend .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.eval-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px; margin-left: 6px; }
.eval-badge.hi { background: #ffe0eb; color: var(--rose); }
.eval-badge.ok { background: #e3f5ea; color: var(--green); }
.eval-badge.lo { background: #fff4d6; color: #d99a00; }
.remind-mark { color: var(--green); font-size: 11px; }

/* ===== 账单月份切换 ===== */
.month-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 10px; }
.mn-btn { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid #ffe0eb; background: #fff; color: var(--primary); font-size: 13px; cursor: pointer; font-family: inherit; line-height: 1; flex-shrink: 0; }
.mn-btn:active { transform: scale(0.92); }
.mn-label { font-size: 14px; font-weight: 700; color: var(--text); min-width: 88px; text-align: center; }

/* ===== 桌面提醒横幅 ===== */
.remind-card { background: linear-gradient(135deg, #fff5fa, #fdeaf2); border: 1.5px solid #ffd6e7; }
.remind-card .card-title { margin-bottom: 8px; }
.rem-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px dashed #f1d6e2; }
.rem-item:first-of-type { border-top: none; }
.rem-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.rem-dot.plan { background: var(--primary); }
.rem-dot.anniv { background: #ff8fb3; }
.rem-main { flex: 1; min-width: 0; }
.rem-text { font-size: 13px; color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rem-time { font-size: 11px; color: var(--text-light); margin-top: 1px; }

/* ===== 预算 / 进度强调 ===== */
.budget-warn { font-size: 12px; color: var(--rose); font-weight: 700; margin-top: 6px; }
.budget-ok { font-size: 12px; color: var(--green); font-weight: 700; margin-top: 6px; }
.theme-row { display: flex; gap: 10px; }
.theme-opt { flex: 1; text-align: center; padding: 10px; border-radius: 14px; border: 2px solid #ffe0eb; font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; user-select: none; }
.theme-opt.sel { border-color: var(--primary); background: #fff0f6; }

  --primary: #5bb8e8;
  --primary-dark: #3a9bc9;
  --rose: #f7a8c0;
  --yellow: #f9d78e;
  --green: #7fd1a6;
  --purple: #b9a6e8;
  --text: #3f5870;
  --text-light: #7d93a6;
  --card-bg: rgba(255,255,255,0.92);
  --card-border: rgba(91,184,232,0.32);
  --shadow: rgba(91,184,232,0.18);
}
body[data-theme="summer"] .phone {
  background: var(--bg-img) center top / cover no-repeat;
}
body[data-theme="summer"] .main {
  background: linear-gradient(180deg, rgba(234,246,252,0.12) 0%, rgba(234,246,252,0.55) 30%, rgba(234,246,252,0.92) 65%, rgba(234,246,252,0.99) 100%);
  position: relative;
  z-index: 1;
  min-height: 100%;
}
body[data-theme="summer"] .phone::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 70%;
  background: linear-gradient(to top, rgba(234,246,252,0.99) 0%, rgba(234,246,252,0.85) 45%, transparent 100%);
  pointer-events: none;
  z-index: 0;
}

/* cards, inputs, chips */
body[data-theme="summer"] .card,
body[data-theme="summer"] .collapse,
body[data-theme="summer"] .collapse.open,
body[data-theme="summer"] .modal,
body[data-theme="summer"] .search-box,
body[data-theme="summer"] .input-row,
body[data-theme="summer"] .region-input,
body[data-theme="summer"] .form-input,
body[data-theme="summer"] .edit-input,
body[data-theme="summer"] .note-area,
body[data-theme="summer"] .opt-chip {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  box-shadow: 0 4px 14px var(--shadow);
  color: var(--text);
  backdrop-filter: blur(6px);
}
body[data-theme="summer"] .chip { border-color: #c8e8f7; }
body[data-theme="summer"] .swipe-item { box-shadow: 0 3px 10px rgba(91,184,232,0.10); }
body[data-theme="summer"] .swipe-body,
body[data-theme="summer"] .todo-body,
body[data-theme="summer"] .plan-body,
body[data-theme="summer"] .lrow,
body[data-theme="summer"] .meal-item,
body[data-theme="summer"] .think-card {
  background: #fff;
  border: none;
  box-shadow: none;
  backdrop-filter: none;
}

/* text colors */
body[data-theme="summer"] .page-head h1,
body[data-theme="summer"] .page-head p,
body[data-theme="summer"] .collapse-head h2,
body[data-theme="summer"] .card-title,
body[data-theme="summer"] .l-title,
body[data-theme="summer"] .l-sub { color: var(--text); }
body[data-theme="summer"] .page-head p { color: var(--text-light); }

/* ---- Sidebar / menu ---- */
body[data-theme="summer"] .sidebar {
  background: linear-gradient(180deg, rgba(255,255,255,0.96) 0%, rgba(231,245,252,0.96) 100%);
  border-right: 1px solid rgba(91,184,232,0.22);
}
body[data-theme="summer"] .menu-item {
  background: transparent;
  color: var(--text);
}
body[data-theme="summer"] .menu-item svg { display: none; }
body[data-theme="summer"] .menu-item::before {
  content: '';

/* ---- themed cards ---- */
body[data-theme="summer"] .greeting-card,
body[data-theme="summer"] .time-card,
body[data-theme="summer"] .quote-card {
  background: linear-gradient(135deg, rgba(255,255,255,0.94) 0%, rgba(230,247,255,0.94) 60%, rgba(218,242,252,0.94) 100%);
}
body[data-theme="summer"] .sum-item {
  background: linear-gradient(135deg, rgba(255,255,255,0.96) 0%, rgba(230,247,255,0.96) 100%);
  box-shadow: 0 3px 10px rgba(91,184,232,0.12);
}
body[data-theme="summer"] .count-card {
  background: linear-gradient(135deg, rgba(255,255,255,0.96) 0%, rgba(230,247,255,0.96) 100%);
}
body[data-theme="summer"] .modal {
  background: linear-gradient(160deg, rgba(255,255,255,0.97) 0%, rgba(230,247,255,0.97) 100%);
  box-shadow: 0 22px 55px rgba(91,184,232,0.32);
}
body[data-theme="summer"] .modal-mask { background: rgba(63,88,112,0.34); }

/* ---- accents unified ---- */
body[data-theme="summer"] .switch.on { background: var(--primary); }
body[data-theme="summer"] .add-circle { background: var(--primary); color: #fff; }
body[data-theme="summer"] .add-confirm,
body[data-theme="summer"] .add-btn {
  background: linear-gradient(90deg, var(--primary) 0%, var(--green) 100%);
}
body[data-theme="summer"] .progress span { background: linear-gradient(90deg, var(--primary), var(--green)); }
body[data-theme="summer"] .progress { background: rgba(91,184,232,0.18); }
body[data-theme="summer"] .ftab.sel { background: var(--primary); color: #fff; }
body[data-theme="summer"] .eval-badge.hi { background: rgba(247,168,192,0.28); color: #c95a73; }
body[data-theme="summer"] .eval-badge.ok { background: rgba(127,209,166,0.28); color: #3f9a6a; }
body[data-theme="summer"] .eval-badge.lo { background: rgba(185,166,232,0.28); color: #6f5aa8; }
body[data-theme="summer"] .reminder-banner {
  background: linear-gradient(90deg, rgba(247,168,192,0.18), rgba(91,184,232,0.18));
  border: 1px solid rgba(91,184,232,0.25);
}
body[data-theme="summer"] .real-link { color: var(--primary-dark); }
body[data-theme="summer"] .swipe-del { background: var(--primary); }
body[data-theme="summer"] .week-cell.has .dn::after,
body[data-theme="summer"] .food-cell.has .dn::after { background: var(--primary); }
body[data-theme="summer"] .tab.active .menu-label { color: var(--primary); }
body[data-theme="summer"] ::-webkit-scrollbar-thumb { background: rgba(91,184,232,0.4); }

/* ---- pink leftovers unified to sky-blue ---- */
body[data-theme="summer"] .badge,
body[data-theme="summer"] .collapse-head .badge {
  background: rgba(91,184,232,0.16) !important;
  color: var(--primary-dark) !important;
}
body[data-theme="summer"] .theme-opt {
  border-color: rgba(91,184,232,0.35);
  color: var(--text);
}
body[data-theme="summer"] .theme-opt.sel {
  border-color: var(--primary);
  background: rgba(91,184,232,0.14);
  color: var(--primary-dark);
}
body[data-theme="summer"] .todo-item,
body[data-theme="summer"] .swipe-item {
  box-shadow: 0 4px 12px rgba(91,184,232,0.10) !important;
}

/* ===== Wish Bottle Theme ===== */

  --primary: #f8a4c1;
  --primary-dark: #e06b8f;
  --rose: #f28da8;
  --yellow: #f9d78e;
  --green: #8fd9b6;
  --purple: #d4b8e8;
  --text: #6a4a5a;
  --text-light: #a67c8e;
  --card-bg: rgba(255,255,255,0.92);
  --card-border: rgba(248,164,193,0.35);
  --shadow: rgba(248,164,193,0.18);
}
body[data-theme="wish"] .phone {
  background: var(--bg-img) center top / cover no-repeat;
}
body[data-theme="wish"] .main {
  background: linear-gradient(180deg, rgba(255,245,248,0.10) 0%, rgba(255,245,248,0.55) 30%, rgba(255,245,248,0.92) 65%, rgba(255,245,248,0.99) 100%);
  position: relative;
  z-index: 1;
  min-height: 100%;
}
body[data-theme="wish"] .phone::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 70%;
  background: linear-gradient(to top, rgba(255,245,248,0.99) 0%, rgba(255,245,248,0.85) 45%, transparent 100%);
  pointer-events: none;
  z-index: 0;
}

body[data-theme="wish"] .card,
body[data-theme="wish"] .collapse,
body[data-theme="wish"] .collapse.open,
body[data-theme="wish"] .modal,
body[data-theme="wish"] .search-box,
body[data-theme="wish"] .input-row,
body[data-theme="wish"] .region-input,
body[data-theme="wish"] .form-input,
body[data-theme="wish"] .edit-input,
body[data-theme="wish"] .note-area,
body[data-theme="wish"] .opt-chip {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  box-shadow: 0 4px 14px var(--shadow);
  color: var(--text);
  backdrop-filter: blur(6px);
}
body[data-theme="wish"] .chip { border-color: #ffd6e4; }
body[data-theme="wish"] .swipe-item { box-shadow: 0 3px 10px rgba(248,164,193,0.10); }
body[data-theme="wish"] .swipe-body,
body[data-theme="wish"] .todo-body,
body[data-theme="wish"] .plan-body,
body[data-theme="wish"] .lrow,
body[data-theme="wish"] .meal-item,
body[data-theme="wish"] .think-card {
  background: #fff;
  border: none;
  box-shadow: none;
  backdrop-filter: none;
}

body[data-theme="wish"] .page-head h1,
body[data-theme="wish"] .page-head p,
body[data-theme="wish"] .collapse-head h2,
body[data-theme="wish"] .card-title,
body[data-theme="wish"] .l-title,
body[data-theme="wish"] .l-sub { color: var(--text); }
body[data-theme="wish"] .page-head p { color: var(--text-light); }

body[data-theme="wish"] .sidebar {
  background: linear-gradient(180deg, rgba(255,255,255,0.96) 0%, rgba(255,240,246,0.96) 100%);
  border-right: 1px solid rgba(248,164,193,0.22);
}
body[data-theme="wish"] .menu-item {
  background: transparent;
  color: var(--text);
}
body[data-theme="wish"] .menu-item svg { display: none; }
body[data-theme="wish"] .menu-item::before {
  content: '';
  width: 30px; height: 30px;
  flex: 0 0 auto;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;

body[data-theme="wish"] .greeting-card,
body[data-theme="wish"] .time-card,
body[data-theme="wish"] .quote-card {
  background: linear-gradient(135deg, rgba(255,255,255,0.94) 0%, rgba(255,240,246,0.94) 60%, rgba(255,235,243,0.94) 100%);
}
body[data-theme="wish"] .sum-item {
  background: linear-gradient(135deg, rgba(255,255,255,0.96) 0%, rgba(255,240,246,0.96) 100%);
  box-shadow: 0 3px 10px rgba(248,164,193,0.12);
}
body[data-theme="wish"] .count-card {
  background: linear-gradient(135deg, rgba(255,255,255,0.96) 0%, rgba(255,240,246,0.96) 100%);
}
body[data-theme="wish"] .modal {
  background: linear-gradient(160deg, rgba(255,255,255,0.97) 0%, rgba(255,240,246,0.97) 100%);
  box-shadow: 0 22px 55px rgba(248,164,193,0.32);
}
body[data-theme="wish"] .modal-mask { background: rgba(106,74,90,0.34); }

body[data-theme="wish"] .switch.on { background: var(--primary); }
body[data-theme="wish"] .add-circle { background: var(--primary); color: #fff; }
body[data-theme="wish"] .add-confirm,
body[data-theme="wish"] .add-btn {
  background: linear-gradient(90deg, var(--primary) 0%, var(--green) 100%);
}
body[data-theme="wish"] .progress span { background: linear-gradient(90deg, var(--primary), var(--green)); }
body[data-theme="wish"] .progress { background: rgba(248,164,193,0.18); }
body[data-theme="wish"] .ftab.sel { background: var(--primary); color: #fff; }
body[data-theme="wish"] .eval-badge.hi { background: rgba(242,141,168,0.28); color: #c55a75; }
body[data-theme="wish"] .eval-badge.ok { background: rgba(143,217,182,0.28); color: #4a9e73; }
body[data-theme="wish"] .eval-badge.lo { background: rgba(212,184,232,0.28); color: #8b6aaa; }

body[data-theme="wish"] .reminder-banner {
  background: linear-gradient(90deg, rgba(248,164,193,0.18), rgba(143,217,182,0.18));
  border: 1px solid rgba(248,164,193,0.25);
}
body[data-theme="wish"] .real-link { color: var(--primary-dark); }
body[data-theme="wish"] .swipe-del { background: var(--primary); }
body[data-theme="wish"] .week-cell.has .dn::after,
body[data-theme="wish"] .food-cell.has .dn::after { background: var(--primary); }
body[data-theme="wish"] .tab.active .menu-label { color: var(--primary); }
body[data-theme="wish"] ::-webkit-scrollbar-thumb { background: rgba(248,164,193,0.4); }

body[data-theme="wish"] .badge,
body[data-theme="wish"] .collapse-head .badge {
  background: rgba(248,164,193,0.16) !important;
  color: var(--primary-dark) !important;
}
body[data-theme="wish"] .theme-opt {
  border-color: rgba(248,164,193,0.35);
  color: var(--text);
}
body[data-theme="wish"] .theme-opt.sel {
  border-color: var(--primary);
  background: rgba(248,164,193,0.14);
  color: var(--primary-dark);
}
body[data-theme="wish"] .todo-item,
body[data-theme="wish"] .swipe-item {
  box-shadow: 0 4px 12px rgba(248,164,193,0.10) !important;
}

  --primary: #d68c6e;
  --primary-dark: #a85d42;
  --rose: #e8a598;
  --yellow: #f9d678;
  --green: #7ec4a0;
  --purple: #9aa8d8;
  --text: #5a463d;
  --text-light: #a08d82;
  --card-bg: rgba(255,255,255,0.93);
  --card-border: rgba(214,140,110,0.32);
  --shadow: rgba(214,140,110,0.18);
}
body[data-theme="party"] .phone {
  background: var(--bg-img) center top / cover no-repeat;
}
body[data-theme="party"] .main {
  background: linear-gradient(180deg, rgba(255,248,240,0.10) 0%, rgba(255,248,240,0.55) 30%, rgba(255,248,240,0.92) 65%, rgba(255,248,240,0.99) 100%);
  position: relative;
  z-index: 1;
  min-height: 100%;
}
body[data-theme="party"] .phone::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 70%;
  background: linear-gradient(to top, rgba(255,248,240,0.99) 0%, rgba(255,248,240,0.85) 45%, transparent 100%);
  pointer-events: none;
  z-index: 0;
}

body[data-theme="party"] .card,
body[data-theme="party"] .collapse,
body[data-theme="party"] .collapse.open,
body[data-theme="party"] .modal,
body[data-theme="party"] .search-box,
body[data-theme="party"] .input-row,
body[data-theme="party"] .region-input,
body[data-theme="party"] .form-input,
body[data-theme="party"] .edit-input,
body[data-theme="party"] .note-area,
body[data-theme="party"] .opt-chip {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  box-shadow: 0 4px 14px var(--shadow);
  color: var(--text);
  backdrop-filter: blur(6px);
}
body[data-theme="party"] .chip { border-color: #f5d9c8; }
body[data-theme="party"] .swipe-item { box-shadow: 0 3px 10px rgba(214,140,110,0.10); }
body[data-theme="party"] .swipe-body,
body[data-theme="party"] .todo-body,
body[data-theme="party"] .plan-body,
body[data-theme="party"] .lrow,
body[data-theme="party"] .meal-item,
body[data-theme="party"] .think-card {
  background: #fff;
  border: none;
  box-shadow: none;
  backdrop-filter: none;
}

body[data-theme="party"] .page-head h1,
body[data-theme="party"] .page-head p,
body[data-theme="party"] .collapse-head h2,
body[data-theme="party"] .card-title,
body[data-theme="party"] .l-title,
body[data-theme="party"] .l-sub { color: var(--text); }
body[data-theme="party"] .page-head p { color: var(--text-light); }

body[data-theme="party"] .sidebar {
  background: linear-gradient(180deg, rgba(255,255,255,0.96) 0%, rgba(255,248,240,0.96) 100%);
  border-right: 1px solid rgba(214,140,110,0.22);
}
body[data-theme="party"] .menu-item {
  background: transparent;
  color: var(--text);
}
body[data-theme="party"] .menu-item svg { display: none; }
body[data-theme="party"] .menu-item::before {
  content: '';
  width: 30px; height: 30px;
  flex: 0 0 auto;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;

body[data-theme="party"] .greeting-card,
body[data-theme="party"] .time-card,
body[data-theme="party"] .quote-card {
  background: linear-gradient(135deg, rgba(255,255,255,0.94) 0%, rgba(255,250,245,0.94) 60%, rgba(255,248,240,0.94) 100%);
}
body[data-theme="party"] .sum-item {
  background: linear-gradient(135deg, rgba(255,255,255,0.96) 0%, rgba(255,250,245,0.96) 100%);
  box-shadow: 0 3px 10px rgba(214,140,110,0.12);
}
body[data-theme="party"] .count-card {
  background: linear-gradient(135deg, rgba(255,255,255,0.96) 0%, rgba(255,250,245,0.96) 100%);
}
body[data-theme="party"] .modal {
  background: linear-gradient(160deg, rgba(255,255,255,0.97) 0%, rgba(255,250,245,0.97) 100%);
  box-shadow: 0 22px 55px rgba(214,140,110,0.32);
}
body[data-theme="party"] .modal-mask { background: rgba(90,70,61,0.34); }

body[data-theme="party"] .switch.on { background: var(--primary); }
body[data-theme="party"] .add-circle { background: var(--primary); color: #fff; }
body[data-theme="party"] .add-confirm,
body[data-theme="party"] .add-btn {
  background: linear-gradient(90deg, var(--primary) 0%, var(--green) 100%);
}
body[data-theme="party"] .progress span { background: linear-gradient(90deg, var(--primary), var(--green)); }
body[data-theme="party"] .progress { background: rgba(214,140,110,0.18); }
body[data-theme="party"] .ftab.sel { background: var(--primary); color: #fff; }
body[data-theme="party"] .eval-badge.hi { background: rgba(214,140,110,0.28); color: #8f563e; }
body[data-theme="party"] .eval-badge.ok { background: rgba(126,196,160,0.28); color: #3a7d55; }
body[data-theme="party"] .eval-badge.lo { background: rgba(154,168,216,0.28); color: #5a6a8a; }

body[data-theme="party"] .reminder-banner {
  background: linear-gradient(90deg, rgba(214,140,110,0.18), rgba(126,196,160,0.18));
  border: 1px solid rgba(214,140,110,0.25);
}
body[data-theme="party"] .real-link { color: var(--primary-dark); }
body[data-theme="party"] .swipe-del { background: var(--primary); }
body[data-theme="party"] .week-cell.has .dn::after,
body[data-theme="party"] .food-cell.has .dn::after { background: var(--primary); }
body[data-theme="party"] .tab.active .menu-label { color: var(--primary); }
body[data-theme="party"] ::-webkit-scrollbar-thumb { background: rgba(214,140,110,0.4); }

body[data-theme="party"] .badge,
body[data-theme="party"] .collapse-head .badge {
  background: rgba(214,140,110,0.16) !important;
  color: var(--primary-dark) !important;
}
body[data-theme="party"] .theme-opt {
  border-color: rgba(214,140,110,0.35);
  color: var(--text);
}
body[data-theme="party"] .theme-opt.sel {
  border-color: var(--primary);
  background: rgba(214,140,110,0.14);
  color: var(--primary-dark);
}
body[data-theme="party"] .todo-item,
body[data-theme="party"] .swipe-item {
  box-shadow: 0 4px 12px rgba(214,140,110,0.10) !important;
}
/* ===== Party Bear Theme End ===== */






body[data-theme="summer"] .input-box,
body[data-theme="summer"] .weight-form .w-field {
  border-color: rgba(91,184,232,0.35) !important;
}
body[data-theme="summer"] .empty-box {

let undoData = null, undoTimer = null;
function pushUndo(label, restore){
  undoData = { label, restore };
  const t = $('undoToast'); if (!t) return;
  $('undoLabel').textContent = label; t.style.display = 'flex';
  clearTimeout(undoTimer); undoTimer = setTimeout(hideUndo, 4500);
}
function hideUndo(){ const t = $('undoToast'); if (t) t.style.display = 'none'; undoData = null; }
function doUndo(){ if (!undoData) return; try { undoData.restore(); } catch(e){} hideUndo(); }
function toast(msg){
  const t = $('undoToast'); if (!t) { return; }
  $('undoLabel').textContent = msg; t.style.display = 'flex';
  clearTimeout(undoTimer); undoTimer = setTimeout(hideUndo, 2600);
}
/* 通用删除（带撤销） */
function genericDel(getArr, setArr, id, label, rerender){
  const arr = getArr(); const idx = arr.findIndex(x => x.id === id);
  if (idx < 0) return;
  const removed = arr[idx]; const copy = arr.slice();
  setArr(arr.filter(x => x.id !== id)); saveState(); rerender();
  pushUndo(label + (removed.name||removed.title||removed.text||'') , () => {
    const a = getArr(); a.splice(Math.min(idx, a.length), 0, removed); setArr(a); saveState(); rerender();
  });
}

function requestNotify(){
  if (!('Notification' in window)) return false;

  return Notification.permission === 'granted';
}

    if (diff >= 0 && diff <= (p.remindDays||0)) fireNotify('🔔 计划提醒', p.title + '（还有 ' + diff + ' 天）');
  });
  // 纪念日提醒（受开关控制）
  if (S.settings.annivReminder) {
    S.anniv.forEach(a => {
      const d = nextAnnivDate(a);
      const diff = daysBetween(t, d);
      if (diff >= 0 && diff <= (a.advance||0)) fireNotify('💖 纪念日提醒', a.name + ' 还有 ' + diff + ' 天');
    });
  }
}

/* WMO 天气代码 → 我们的类型 */
function wmoType(code){
  code = +code;
  if ([0,1,2,3].includes(code)) return 'sun';
  if ([45,48].includes(code)) return 'cloud';
  return 'rain'; // 各类雨/雪/雷暴均归为“雨”显示
}
/* 真实天气获取（open-meteo，免费、支持跨域），失败返回 null */
async function fetchWeather(region, days){
  try{
    let coord = CITY_COORDS[region];
    if (!coord){
      const g = await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(region.replace(/[市辖区区县省]/g,''))+'&count=1&language=zh').then(r=>r.json());
      if (g && g.results && g.results[0]) coord = [g.results[0].latitude, g.results[0].longitude];
    }
    if (!coord) return null;
    const url = 'https://api.open-meteo.com/v1/forecast?latitude='+coord[0]+'&longitude='+coord[1]
      + '&daily=weathercode,temperature_2m_max,temperature_2m_min&current=temperature_2m,weathercode&timezone=Asia%2FShanghai&forecast_days='+days;
    const d = await fetch(url).then(r=>r.json());
    if (!d || !d.daily || !d.daily.time) return null;
    const wk = ['周日','周一','周二','周三','周四','周五','周六'];
    const fc = d.daily.time.map((t,i)=>{
      const date = new Date(t+'T00:00:00');
      const label = i===0 ? '今天' : (i===1 ? '明天' : wk[date.getDay()]);
      return { label, type: wmoType(d.daily.weathercode[i]), low: Math.round(d.daily.temperature_2m_min[i]), high: Math.round(d.daily.temperature_2m_max[i]) };
    });
    return { cur:{ type: wmoType(d.current.weathercode), temp: Math.round(d.current.temperature_2m) }, fc };
  }catch(e){ return null; }
}
function genForecast(region, days){
  const today = new Date();
  const types = ['sun','cloud','rain'];
  const wk = ['周日','周一','周二','周三','周四','周五','周六'];
  const monthBias = [4, 6, 11, 17, 22, 26, 30, 29, 25, 19, 13, 7];
  const bias = monthBias[today.getMonth()];
  let seed = hashStr(region) || 1;
  let curTemp = bias + (hashStr(region+'x') % 5) - 2;
  let prevType = types[seed % 3];
  const arr = [];
  for (let i=0;i<days;i++){
    const d = new Date(today); d.setDate(today.getDate() + i);
    const daySeq = Math.floor((d - new Date(d.getFullYear(),0,0)) / 86400000);
    const dv = hashStr(region + daySeq);
    curTemp += ((dv % 5) - 2);
    curTemp = Math.max(bias - 9, Math.min(bias + 9, curTemp));
    const tv = hashStr(region + 't' + daySeq);
    let type = prevType;
    if (tv % 10 < 3) type = types[tv % 3];
    prevType = type;
    const mid = Math.round(curTemp);
    const low = mid - 2 - (tv % 3);
    const high = mid + 1 + (tv % 2);
    const label = i===0 ? '今天' : (i===1 ? '明天' : wk[d.getDay()]);
    arr.push({ label, type, low, high });
  }
  return arr;
}

function clearSwipe(b){ b.style.transition = 'transform .22s ease'; b.style.transform = 'translateX(0)'; }
const SWIPE_W = 86;
/* 通用手势：dir=-1 左滑露出删除，dir=1 右滑露出删除；长按 560ms 触发 editFn(元素) */
let _lt = 0, _le = null, _lastTouch = 0;
function attachSwipe(cid, dir, editFn){
  const c = $(cid); if (!c) return;
  c.querySelectorAll('.swipe-body').forEach(b => {
    if (b._sw) return; b._sw = true;
    let sx = 0, sy = 0, swiping = false, down = false, lp = null, touch = false;
    const start = (x, y, isTouch) => {
      sx = x; sy = y; swiping = false; down = true; touch = isTouch; clearTimeout(lp);
      lp = setTimeout(() => { down = false; clearSwipe(b); if (editFn) editFn(b); }, 560);
    };
    const move = (x, y, ev) => {
      if (!down) return;
      const dx = x - sx, dy = y - sy;
      if (!swiping && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { swiping = true; clearTimeout(lp); }
      else if (!swiping && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) { clearTimeout(lp); }
      if (swiping) {
        if (ev && ev.cancelable) ev.preventDefault();
        const off = dir < 0 ? Math.max(-SWIPE_W, Math.min(0, dx)) : Math.min(SWIPE_W, Math.max(0, dx));
        b.style.transition = 'none'; b.style.transform = 'translateX('+off+'px)';
      }
    };
    const end = (x) => {
      clearTimeout(lp);
      if (!swiping) {
        down = false;
        const now = Date.now();
        if (_le === b && now - _lt < 330) {
          _le = null; _lt = 0;
          const d = b.getAttribute('data-dbl');
          if (d) { try { (0, eval)(d); } catch(e){} }
        } else { _le = b; _lt = now; }
        return;
      }
      const dx = x - sx; down = false; swiping = false;
      b.style.transition = 'transform .22s ease';
      const open = dir < 0 ? dx < -42 : dx > 42;
      b.style.transform = open ? 'translateX('+(dir < 0 ? -SWIPE_W : SWIPE_W)+'px)' : 'translateX(0)';
    };
    b.addEventListener('touchstart', e => { _lastTouch = Date.now(); start(e.touches[0].clientX, e.touches[0].clientY, true); }, {passive:true});
    b.addEventListener('touchmove', e => move(e.touches[0].clientX, e.touches[0].clientY, e), {passive:false});
    b.addEventListener('touchend', e => end(e.changedTouches[0].clientX));
    b.addEventListener('touchcancel', () => { clearTimeout(lp); down = false; swiping = false; clearSwipe(b); });
    // 屏蔽触摸后浏览器模拟的鼠标事件，避免单次轻触被误判为双击
    const mouseGuard = () => Date.now() - _lastTouch < 700;
    b.addEventListener('mousedown', e => { if (mouseGuard()) return; start(e.clientX, e.clientY, false); });
    b.addEventListener('mousemove', e => { if (mouseGuard()) return; move(e.clientX, e.clientY, null); });
    b.addEventListener('mouseup', e => { if (mouseGuard()) return; end(e.clientX); });
    b.addEventListener('mouseleave', e => { if (mouseGuard()) return; clearTimeout(lp); if (swiping) end(e.clientX); else down = false; });
  });
}

let formCb = null;
let pendingFiles = {};
function handleFile(key, input){
  const file = input.files && input.files[0];
  if (!file){ pendingFiles[key] = ''; return; }
  const MAX = 720; // 压缩后最长边
  const compress = (src, cb) => {
    const img = new Image();
    img.onload = () => {
      let { width:w, height:h } = img;
      if (w > MAX || h > MAX) { const r = Math.min(MAX/w, MAX/h); w = Math.round(w*r); h = Math.round(h*r); }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      try { cb(cv.toDataURL('image/jpeg', 0.72)); } catch(e){ cb(src); }
    };
    img.onerror = () => cb(src);
    img.src = src;
  };
  const reader = new FileReader();
  reader.onload = e => compress(e.target.result, out => { pendingFiles[key] = out; });
  reader.readAsDataURL(file);
}
function openForm(title, fields, cb){
  formCb = cb;
  pendingFiles = {};
  $('formTitle').textContent = title;
  let html = '';
  fields.forEach(f => {
    const val = f.value !== undefined ? f.value : '';
    if (f.type === 'select') {

    } else if (f.type === 'textarea') {
      html += '<div class="form-field"><label>'+f.label+'</label><textarea class="form-input" data-key="'+f.key+'" placeholder="'+(f.placeholder||'')+'">'+escapeHtml(val)+'</textarea></div>';
    } else if (f.type === 'stepper') {
      html += '<div class="form-field"><label>'+f.label+'</label><div class="form-stepper"><span class="step-btn" onclick="formStep(-1)">−</span><span class="num" id="formStepperNum">'+val+'</span><span class="step-btn" onclick="formStep(1)">+</span></div><input type="hidden" data-key="'+f.key+'" id="formStepperVal" value="'+val+'"></div>';
    } else if (f.type === 'file') {
      html += '<div class="form-field"><label>'+f.label+'</label><input type="file" accept="image/*" class="form-input" style="padding:8px" onchange="handleFile(\''+f.key+'\',this)"></div>';
    } else {
      html += '<div class="form-field"><label>'+f.label+'</label><input class="form-input" data-key="'+f.key+'" type="'+(f.type==='date'?'date':'text')+'" value="'+escapeHtml(val)+'" placeholder="'+(f.placeholder||'')+'"></div>';
    }
  });
  $('formBody').innerHTML = html;
  $('formModal').classList.add('show');
}

function exportBill(){
  const ym = curBillMonth();
  const rows = S.accounts.filter(a => (a.date||'').slice(0,7) === ym).sort((a,b) => (a.date||'').localeCompare(b.date||''));
  const esc = v => { v = String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const head = ['日期','类型','归属','分类','备注','金额(元)'];
  let csv = head.join(',') + '\n';
  rows.forEach(a => {
    csv += [a.date||'', a.type==='inc'?'收入':'支出', a.member||'', a.cat||'', a.note||'', a.amount].map(esc).join(',') + '\n';
  });
  const blob = new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '账单_'+ym+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function computeSums(){
  const now = new Date(); const ym = now.getFullYear()+'-'+pad(now.getMonth()+1);
  let inc=0, exp=0, bal=0;
  S.accounts.forEach(a => {
    const amt = (+a.amount) || 0;
    const ym0 = (a.date||'').slice(0,7);
    bal += (a.type==='inc' ? amt : -amt);
    if (ym0 === ym) { if (a.type==='inc') inc+=amt; else exp+=amt; }
  });
  return { inc, exp, bal };
}

function renderAnalysis(){

    S.accounts.forEach(a=>{ const dd=new Date(a.date); const key=dd.getFullYear()+'年'; if(groups[key]){ if(a.type==='inc')groups[key].inc+=a.amount; else groups[key].exp+=a.amount; } });

    const span = daysBetween(from, to);

    S.accounts.forEach(a => {
      const d = datePart(a.date); if (!d || d < from || d > to) return;
      const sk = (span >= 0 && span <= 45) ? d : d.slice(0,7);
      if (!map[sk]) { map[sk] = {inc:0, exp:0}; labels[sk] = (span >= 0 && span <= 45) ? (+d.slice(5,7))+'/'+(+d.slice(8,10)) : (+d.slice(5,7))+'月'; }

  else if (anMode === 'year'){ const y=new Date().getFullYear(); rFrom=y+'-01-01'; rTo=y+'-12-31'; pieTitle='🍩 本年支出分类占比'; trendTitle='📈 近年累计结余趋势'; }
  else { const fe=$('anFrom'), te=$('anTo'); rFrom=(fe&&fe.value)||'2000-01-01'; rTo=(te&&te.value)||'2100-12-31'; pieTitle='🍩 区间支出分类占比'; trendTitle='📈 区间累计结余趋势'; }
  el.innerHTML = barChart(groups)

    + '<div style="margin-top:14px;font-size:13px;color:var(--text);font-weight:700">'+pieTitle+'</div>'

function monthCategorySegs(from, to){
  // 未传区间时默认「本月」；分析页按当前模式传入自定义/年度区间
  if (from === undefined){ const y=new Date().getFullYear(), m=pad(new Date().getMonth()+1); from=y+'-'+m+'-01'; to=y+'-'+m+'-31'; }
  const map={}; const colors=['#ff6b9e','#ffb02e','#73d089','#5aa9e6','#b388ff','#ff8fb3','#ffd266','#f26288','#9ecaff','#c8a8ff'];
  S.accounts.forEach(a=>{ if(a.type==='exp'){ const d=datePart(a.date); if(d && d>=from && d<=to){ const k=a.cat||'其他'; map[k]=(map[k]||0)+(+a.amount); } } });
  const keys=Object.keys(map); return keys.map((k,i)=>({label:k,value:map[k],color:colors[i%colors.length]}));
}
function pieChart(segs){
  const total = segs.reduce((s,x)=>s+x.value,0);
  if (total<=0) return '<div class="empty-box" style="padding:12px"><p style="font-size:13px">本月暂无支出分类~</p></div>';
  const cx=70, cy=70, r=52; let ang=-Math.PI/2; let paths=''; const legend=[];
  segs.forEach(s=>{ const a2=ang + s.value/total*Math.PI*2; const x1=cx+r*Math.cos(ang), y1=cy+r*Math.sin(ang); const x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2); const large=(a2-ang)>Math.PI?1:0; paths+='<path d="M'+cx+' '+cy+' L'+x1.toFixed(1)+' '+y1.toFixed(1)+' A'+r+' '+r+' 0 '+large+' 1 '+x2.toFixed(1)+' '+y2.toFixed(1)+' Z" fill="'+s.color+'"/>'; legend.push('<span class="pl"><span class="dot" style="background:'+s.color+'"></span>'+escapeHtml(s.label)+' ¥'+s.value.toLocaleString()+'</span>'); ang=a2; });
  return '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><svg width="120" height="120" viewBox="0 0 140 140">'+paths+'<circle cx="'+cx+'" cy="'+cy+'" r="26" fill="#fff"/></svg><div class="pie-legend" style="flex:1;min-width:140px">'+legend.join('')+'</div></div>';
}
function trendChart(from, to){
  let months = [];
  if (from === undefined){
    const now=new Date(), y=now.getFullYear(), m=now.getMonth();
    for(let i=5;i>=0;i--){ const d=new Date(y,m-i,1); months.push(d.getFullYear()+'-'+pad(d.getMonth()+1)); }
  } else {
    const d0=new Date(from), d1=new Date(to);
    let y=d0.getFullYear(), m=d0.getMonth();
    while (y<d1.getFullYear() || (y===d1.getFullYear() && m<=d1.getMonth())){
      months.push(y+'-'+pad(m+1)); m++; if(m>11){m=0;y++;}
    }
    if (!months.length) months.push(datePart(from).slice(0,7));
  }
  const labels=[], net=[]; let cum=0;
  months.forEach(ym=>{ let inc=0,exp=0; S.accounts.forEach(a=>{ if((a.date||'').slice(0,7)===ym){ if(a.type==='inc')inc+=+a.amount; else exp+=+a.amount; } }); cum+=inc-exp; labels.push((+ym.slice(5))+'月'); net.push(cum); });
  const s1=labels.map(l=>({label:l,v:NaN}));
  const s2=net.map((v,i)=>({label:labels[i],v}));

}
function barChart(groups){
  const ks = Object.keys(groups);
  const W2 = Math.max(340, ks.length*64);
  const H = 200, pad = 30; const cw = W2 - pad*2; const ch = H - pad*2;
  let max = 0; ks.forEach(k=>{ max=Math.max(max, groups[k].inc, groups[k].exp); }); max = max||1;
  const bw = cw/ks.length; const step = bw*0.66; const iw = step/2;
  let svg = '<svg width="'+W2+'" height="'+H+'" viewBox="0 0 '+W2+' '+H+'">';
  for (let i=0;i<=4;i++){ const y = pad + ch - ch*i/4; svg += '<line x1="'+pad+'" y1="'+y+'" x2="'+(W2-pad)+'" y2="'+y+'" stroke="#f3e3e9"/><text x="2" y="'+(y+4)+'" font-size="9" fill="#a88b92">'+Math.round(max*i/4)+'</text>'; }
  ks.forEach((k,i)=>{
    const x = pad + bw*i + (bw-step)/2;
    const hi = groups[k].inc/max*ch, he = groups[k].exp/max*ch;
    svg += '<rect x="'+x+'" y="'+(pad+ch-he)+'" width="'+iw+'" height="'+he+'" rx="4" fill="#f26288"/>';
    svg += '<rect x="'+(x+iw+2)+'" y="'+(pad+ch-hi)+'" width="'+iw+'" height="'+hi+'" rx="4" fill="#73d089"/>';
    svg += '<text x="'+(x+step/2)+'" y="'+(H-8)+'" font-size="10" fill="#5c3a41" text-anchor="middle">'+k+'</text>';
  });
  svg += '<rect x="'+(W2-pad-90)+'" y="4" width="90" height="14" rx="7" fill="#fff0f6"/><circle cx="'+(W2-pad-80)+'" cy="11" r="4" fill="#73d089"/><text x="'+(W2-pad-72)+'" y="14" font-size="9" fill="#5c3a41">收入</text><circle cx="'+(W2-pad-44)+'" cy="11" r="4" fill="#f26288"/><text x="'+(W2-pad-36)+'" y="14" font-size="9" fill="#5c3a41">支出</text>';
  svg += '</svg>';
  return svg;
}

      else html += ' · 当前 '+curJ+' 斤 <span class="budget-warn">还差 '+Math.abs(diff)+' 斤</span>';

        const pct = Math.max(0, Math.min(100, Math.round((cur - init)/(targetKg - init)*100)));
        html += '<div class="progress" style="margin-top:6px"><span style="width:'+pct+'%"></span></div><div class="piggy-foot"><span>已增 '+Math.round((cur-init)*2*10)/10+' 斤</span><span>距目标进度 '+pct+'%</span></div>';
      }
    } else {
      if (diff <= 0) html += ' · 当前 '+curJ+' 斤 <span class="eval-badge ok">🎉 已达标</span>';
      else html += ' · 当前 '+curJ+' 斤 <span class="budget-warn">还差 '+diff+' 斤</span>';
      if (init && init > targetKg){
        const pct = Math.max(0, Math.min(100, Math.round((init - cur)/(init - targetKg)*100)));
        html += '<div class="progress" style="margin-top:6px"><span style="width:'+pct+'%"></span></div><div class="piggy-foot"><span>已减 '+Math.round((init-cur)*2*10)/10+' 斤</span><span>距目标进度 '+pct+'%</span></div>';
      }
    }
  } else {
    html += ' · 记录体重后显示进度';
  }
  html += '</div>';
  sp.innerHTML = html; return html;
}

  if (list.length < 1){ el.innerHTML = '<div class="empty-box"><p>记录后这里会出现曲线~</p></div>'; return; }
  const s1 = list.map(w=>({label:fmtDateCn(w.date), v: (w.morning!=='-'&&w.morning!=='') ? parseFloat(w.morning)*2 : NaN}));
  const s2 = list.map(w=>({label:fmtDateCn(w.date), v: (w.evening!=='-'&&w.evening!=='') ? parseFloat(w.evening)*2 : NaN}));
  el.innerHTML = lineChart(s1, s2, ['#73d089','#f26288'], ['早','晚']);

function lineChart(s1, s2, colors, labels){
  const W = 380, H = 200, pad = 30; const cw = W-pad*2, ch = H-pad*2;
  const allv = s1.map(x=>x.v).concat(s2.map(x=>x.v)).filter(v=>!isNaN(v));
  let max = Math.max(...allv, 0), min = Math.min(...allv, 0); if (max===min){max+=1;min-=1;}
  const n = s1.length;
  const xOf = i => pad + (n===1?cw/2:cw*i/(n-1));
  const yOf = v => pad + ch - (v-min)/(max-min)*ch;
  let svg = '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  for (let i=0;i<=4;i++){ const y=pad+ch-ch*i/4; svg+='<line x1="'+pad+'" y1="'+y+'" x2="'+(W-pad)+'" y2="'+y+'" stroke="#f3e3e9"/><text x="2" y="'+(y+4)+'" font-size="9" fill="#a88b92">'+Math.round((max-min)*i/4+min)+'</text>'; }
  [s1,s2].forEach((s,si)=>{
    let path=''; s.forEach((p,i)=>{ if(isNaN(p.v))return; path += (path?' L':'M')+xOf(i)+' '+yOf(p.v); });
    svg += '<path d="'+path+'" fill="none" stroke="'+colors[si]+'" stroke-width="2.5" stroke-linecap="round"/>';
    s.forEach((p,i)=>{ if(isNaN(p.v))return; svg+='<circle cx="'+xOf(i)+'" cy="'+yOf(p.v)+'" r="3" fill="'+colors[si]+'"/>'; });
  });
  s1.forEach((p,i)=>{ if(i%Math.ceil(n/6)===0) svg+='<text x="'+xOf(i)+'" y="'+(H-8)+'" font-size="9" fill="#5c3a41" text-anchor="middle">'+p.label+'</text>'; });
  svg += '<rect x="'+(W-pad-90)+'" y="4" width="90" height="14" rx="7" fill="#fff0f6"/><circle cx="'+(W-pad-80)+'" cy="11" r="4" fill="'+colors[0]+'"/><text x="'+(W-pad-72)+'" y="14" font-size="9" fill="#5c3a41">'+labels[0]+'</text><circle cx="'+(W-pad-44)+'" cy="11" r="4" fill="'+colors[1]+'"/><text x="'+(W-pad-36)+'" y="14" font-size="9" fill="#5c3a41">'+labels[1]+'</text>';
  svg += '</svg>'; return svg;
}

const WHO_AGES = [0,2,4,6,8,10,12,18,24,30,36,48,60];
let growthMetric = 'weight';
function growthHTML(){
  return '<div class="card"><div class="card-title"><svg class="kitty-sticker" width="26" height="26" viewBox="0 0 100 100"><use href="#kitty"/></svg>身高体重头围记录<span class="add-circle" onclick="addGrowth()" title="新增记录">+</span></div><div class="list-card" id="growthList"></div></div>'
  + '<div class="card"><div class="card-title"><svg class="kitty-sticker" width="26" height="26" viewBox="0 0 100 100"><use href="#kitty"/></svg>成长曲线图💯</div>'
  + '<div class="toggle-row" style="margin-bottom:12px"><div class="ftab sel" id="gw" onclick="setGrowthMetric(\'weight\')">体重</div><div class="ftab" id="gh" onclick="setGrowthMetric(\'height\')">身高</div><div class="ftab" id="gc" onclick="setGrowthMetric(\'hc\')">头围</div></div>'
  + '<div class="chart-box" id="growthChart"></div><div class="l-sub" id="growthSummary" style="margin-top:6px;font-size:11px">参考：WHO 0-60月 '+whoLabel()+' 百分位曲线（'+babyGender()+'）</div></div>';
}
function babyGender(){ return S.baby.gender==='男'?'boy':'girl'; }
function whoLabel(){ return {weight:'体重(kg)',height:'身高(cm)',hc:'头围(cm)'}[growthMetric]; }
function bindGrowth(){ renderGrowthList(); renderGrowth(); }
function whoEval(metric, ageMonths, value){
  const g = WHO[babyGender()][metric];
  let idx = 0; for (let i=0;i<WHO_AGES.length;i++){ if (WHO_AGES[i] <= ageMonths) idx = i; }
  // 头围等部分指标采样点少于年龄轴，越界时钳制到最后一个有效采样点，避免取到 undefined 静默误判为「正常」
  idx = Math.min(idx, g.p3.length - 1);
  const p3 = g.p3[idx], p97 = g.p97[idx];
  if (!(p3>0) || !(p97>0)) return { cls:'ok', txt:'正常' };
  if (value > p97) return { cls:'hi', txt:'偏高' };
  if (value < p3) return { cls:'lo', txt:'偏低' };
  return { cls:'ok', txt:'正常' };
}
function growthEval(r){
  const age = monthsBetween(S.baby.birth, r.date);
  if (!(age>=0) || !isFinite(age)) return '';
  const out = [];
  [['weight','体重',r.weight,'kg'],['height','身高',r.height,'cm'],['hc','头围',r.hc,'cm']].forEach(([m,label,v,unit])=>{
    if (v==='' || v==null) return;
    const e = whoEval(m, age, parseFloat(v));
    out.push(label+' '+v+unit+' <span class="eval-badge '+e.cls+'">'+e.txt+'</span>');
  });
  return out.join(' · ');
}
function renderGrowthList(){
  const el = $('growthList'); if (!el) return;
  if (!S.growth.length) { el.innerHTML = '<div class="empty-box"><p>还没有测量记录~</p><span>点右上角 + 记录一笔</span></div>'; return; }
  el.innerHTML = S.growth.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(r => {
    const evalHtml = growthEval(r);
    return '<div class="swipe-item"><div class="swipe-del right" onclick="delGrowth('+r.id+')">删除</div>'
      + '<div class="lrow swipe-body" data-id="'+r.id+'"><div class="l-icon">📏</div><div class="l-main"><div class="l-title">'+fmtDateCn(r.date)+'</div><div class="l-sub">'+evalHtml+'</div></div></div></div>';
  }).join('');
  attachSwipe('growthList', -1, b => editGrowth(+b.dataset.id));
}
function delGrowth(id){ genericDel(()=>S.growth, v=>S.growth=v, id, '已删除成长记录', ()=>{ renderGrowthList(); renderGrowth(); }); }
function editGrowth(id){
  const r = S.growth.find(x=>x.id===id); if (!r) return;
  openForm('编辑成长数据', [
    { key:'date', label:'测量日期', type:'date', value: datePart(r.date) },
    { key:'weight', label:'体重(kg)', type:'text', value: r.weight||'' },
    { key:'height', label:'身高(cm)', type:'text', value: r.height||'' },
    { key:'hc', label:'头围(cm)', type:'text', value: r.hc||'' }
  ], v => {
    const w=parseFloat(v.weight), h=parseFloat(v.height), c=parseFloat(v.hc);
    if (!(w>0||h>0||c>0)) return;
    Object.assign(r, { date:v.date, weight:w>0?w:'', height:h>0?h:'', hc:c>0?c:'' });
    saveState(); renderGrowthList(); renderGrowth();
  });
}
function setGrowthMetric(m){ growthMetric=m; ['weight','height','hc'].forEach(x=>$('g'+x[0]).classList.toggle('sel', x===m)); renderGrowth(); }
function renderGrowth(){
  const g = WHO[babyGender()][growthMetric];
  const W=360,H=220,pad=34; const cw=W-pad*2, ch=H-pad*2;
  const maxAge=60;
  const series=[['p3','#ffd266'],['p50','#f26288'],['p97','#73d089']];
  let maxV=0,minV=999; series.forEach(s=>g[s[0]].forEach(v=>{maxV=Math.max(maxV,v);minV=Math.min(minV,v);}));
  S.growth.forEach(r=>{ const v=growthMetric==='weight'?r.weight:(growthMetric==='height'?r.height:r.hc); if(v){maxV=Math.max(maxV,v);minV=Math.min(minV,v);} });
  const xOf=a=>pad+cw*a/maxAge; const yOf=v=>pad+ch-(v-minV)/((maxV-minV)||1)*ch;
  let svg='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  for(let i=0;i<=4;i++){ const y=pad+ch-ch*i/4; svg+='<line x1="'+pad+'" y1="'+y+'" x2="'+(W-pad)+'" y2="'+y+'" stroke="#f3e3e9"/><text x="2" y="'+(y+4)+'" font-size="9" fill="#a88b92">'+Math.round((maxV-minV)*i/4+minV)+'</text>'; }
  for(let a=0;a<=60;a+=12){ svg+='<text x="'+(xOf(a)-6)+'" y="'+(H-8)+'" font-size="9" fill="#5c3a41">'+a+'月</text>'; }
  // 头围采样点仅到 36 月，按各指标真实数据长度绘制参考曲线，避免越界取到 undefined 产生 NaN
  series.forEach(s=>{ let path=''; for (let i=0;i<g[s[0]].length;i++){ const age=WHO_AGES[i]; path+=(path?' L':'M')+xOf(age)+' '+yOf(g[s[0]][i]); } svg+='<path d="'+path+'" fill="none" stroke="'+s[1]+'" stroke-width="2" stroke-dasharray="'+(s[0]==='p50'?'0':'4 3')+'"/>'; });
  // 宝宝点
  const pts=S.growth.map(r=>{ const age=monthsBetween(S.baby.birth,r.date); const v=growthMetric==='weight'?r.weight:(growthMetric==='height'?r.height:r.hc); return {age,v}; }).filter(p=>p.v);
  pts.sort((a,b)=>a.age-b.age);
  let bp=''; pts.forEach(p=>{ bp+=(bp?' L':'M')+xOf(p.age)+' '+yOf(p.v); });
  if(bp) svg+='<path d="'+bp+'" fill="none" stroke="#5c3a41" stroke-width="2.5"/>';
  pts.forEach(p=>{ svg+='<circle cx="'+xOf(p.age)+'" cy="'+yOf(p.v)+'" r="3.5" fill="#ff6b9e"/>'; });
  svg+='<text x="'+(pad+4)+'" y="14" font-size="10" fill="#5c3a41">实线=中位数 虚线=3%/97%</text>';
  svg+='</svg>';
  $('growthChart').innerHTML = svg;
  const sum = $('growthSummary');
  if (sum){
    const sorted = S.growth.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const last = sorted[0];
    let txt = '参考：WHO 0-60月 '+whoLabel()+' 百分位曲线（'+babyGender()+'）';
    if (last){ const e = growthEval(last); txt = '最近一次（'+fmtDateCn(last.date)+'）：'+(e||'暂无评估'); }
    sum.innerHTML = txt;
  }
}
function monthsBetween(a,b){ const d1=new Date(datePart(a)), d2=new Date(datePart(b)); d1.setHours(0,0,0,0); d2.setHours(0,0,0,0); return (d2-d1)/86400000/30.44; }
function addGrowth(){ openForm('记录成长数据',[{key:'date',label:'测量日期',type:'date',value:todayStr()},{key:'weight',label:'体重(kg)',type:'text',placeholder:'例如 8.2'},{key:'height',label:'身高(cm)',type:'text',placeholder:'例如 70'},{key:'hc',label:'头围(cm)',type:'text',placeholder:'例如 43'}],v=>{ const w=parseFloat(v.weight),h=parseFloat(v.height),c=parseFloat(v.hc); if(!(w>0||h>0||c>0))return; S.growth.push({id:Date.now(),date:v.date,weight:w>0?w:'',height:h>0?h:'',hc:c>0?c:''}); saveState(); renderGrowth(); }); }

/* ============ 纪念页 ============ */
function annivHTML(){
  return '<div class="page-head"><div class="ph-avatar"><svg class="kitty-sticker" width="34" height="34" viewBox="0 0 100 100"><use href="#kitty"/></svg></div><div><h1>纪念</h1><p>重要的日子，Kitty帮你记得</p></div></div>'
  + '<div class="card-title" style="margin-bottom:10px"><svg class="kitty-sticker" width="26" height="26" viewBox="0 0 100 100"><use href="#kitty"/></svg>纪念日倒数<span class="add-circle" onclick="addAnniv()">+</span></div><div id="annivList"></div>';
}
function nextAnnivDate(a){
  if (!a.loop) return a.date;
  const base = datePart(a.date); if (!base) return a.date;
  let d = new Date(base+'T00:00:00'); const today = new Date(todayStr()+'T00:00:00');
  let guard = 0;
  while (d < today && guard < 200){ d.setFullYear(d.getFullYear()+1); guard++; }
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function bindAnniv(){ renderAnniv(); }
function renderAnniv(){
  const el=$('annivList'); if(!el)return;
  if(!S.anniv.length){ el.innerHTML='<div class="empty-box"><p>还没有纪念日~</p></div>'; return; }
  const today = todayStr();
  el.innerHTML=S.anniv.map(a=>{
    const nd = nextAnnivDate(a);
    const diff=daysBetween(today, nd);
    let num, unit, col;
    if (diff>0){ num=diff; unit='天后'; col='var(--primary)'; }
    else if (diff===0){ num='今天'; unit=''; col='var(--rose)'; }
    else { num=-diff; unit='天前'; col='var(--text-light)'; }
    const baseY = +datePart(a.date).slice(0,4); const nextY = +nd.slice(0,4);
    const annivNo = (nextY > baseY) ? '（'+ (nextY-baseY) +'周年）' : '';
    const adv = (diff>=0 && diff<=(a.advance||0)) ? ' <span class="remind-mark">🔔 提醒中</span>' : '';
    return '<div class="swipe-item r22"><div class="swipe-del right" onclick="delAnniv('+a.id+')">删除</div><div class="cc-host swipe-body" data-id="'+a.id+'" style="background:transparent"><div class="count-card"><span class="cc-emoji">'+(a.emoji||'📅')+'</span><div class="cc-main"><div class="cc-name">'+escapeHtml(a.name)+'</div><div class="cc-sub">'+fmtDateCn(nd)+annivNo+' · 提前 '+a.advance+' 天提醒'+adv+'</div></div><div class="cc-num"><b style="color:'+col+'">'+num+'</b><span>'+unit+'</span></div></div></div></div>';
  }).join('');
  if (el) attachSwipe('annivList', -1, b => editAnniv(+b.dataset.id));
}
function addAnniv(){ openForm('新增纪念日',[{key:'name',label:'名称',type:'text',placeholder:'例如 结婚纪念日'},{key:'date',label:'日期',type:'date',value:todayStr()},{key:'advance',label:'提前提醒天数',type:'stepper',value:7},{key:'loop',label:'每年自动循环',type:'select',options:['是','否'],value:'是'},{key:'emoji',label:'图标emoji',type:'text',value:'📅',placeholder:'例如 💍'}],v=>{ if(!v.name.trim())return; S.anniv.push({id:Date.now(),name:v.name.trim(),date:v.date,advance:v.advance||0,emoji:v.emoji||'📅',loop:v.loop!=='否'}); saveState(); renderAnniv(); renderTodos(); }); }
function delAnniv(id){ genericDel(()=>S.anniv, v=>S.anniv=v, id, '已删除纪念日', ()=>{ renderAnniv(); renderTodos(); }); }
function editAnniv(id){
  const a = S.anniv.find(x=>x.id===id); if(!a) return;
  openForm('编辑纪念日', [
    { key:'name', label:'名称', type:'text', value:a.name },
    { key:'date', label:'日期', type:'date', value: datePart(a.date) },
    { key:'advance', label:'提前提醒天数', type:'stepper', value:a.advance||0 },
    { key:'loop', label:'每年自动循环', type:'select', options:['是','否'], value:(a.loop===false?'否':'是') },
    { key:'emoji', label:'图标emoji', type:'text', value:a.emoji||'📅' }
  ], v => { if (!v.name.trim()) return; Object.assign(a, { name:v.name.trim(), date:v.date, advance:v.advance||0, loop:v.loop!=='否', emoji:v.emoji||'📅' }); saveState(); renderAnniv(); renderTodos(); });
}

  const k = SETMAP[id]; if (!k) return;
  S.settings[k] = !S.settings[k];
  const el = $(id); if (el) el.classList.toggle('on', S.settings[k]);
  saveState();
  if (k === 'weatherWidget' || k === 'autoQuote') switchPage('桌面');
  if (k === 'notify' && S.settings.notify) { requestNotify(); checkNotifications(); toast('已开启本地通知'); }
}

  S.settings.theme = th; saveState(); applyTheme();
  const labelMap = { pink:'甜粉', night:'夜间', summer:'夏日', wish:'许愿', party:'派对熊' };
  const label = labelMap[th] || '甜粉';

function editFamily(i){
  const f = S.family[i]; if(!f) return;
  openForm('编辑家庭成员',[
    {key:'name',label:'称呼',type:'text',value:f.name},
    {key:'role',label:'角色',type:'text',value:f.role},
    {key:'emoji',label:'图标emoji',type:'text',value:f.emoji||'🧑'},
    {key:'avatar',label:'头像（可选，从相册上传）',type:'file'}
  ], v=>{ if(!v.name.trim())return; const av=(v.avatar&&v.avatar.indexOf('data:image')===0)?v.avatar:(f.avatar||''); S.family[i]={name:v.name.trim(),role:v.role||'成员',emoji:v.emoji||'🧑',avatar:av}; saveState(); renderFamily(); });
}
function addFamily(){ openForm('添加家庭成员',[{key:'name',label:'称呼',type:'text',placeholder:'例如 爷爷'},{key:'role',label:'角色',type:'text',placeholder:'例如 长辈'},{key:'emoji',label:'图标emoji',type:'text',value:'🧑',placeholder:'例如 👵'},{key:'avatar',label:'头像（可选，从相册上传）',type:'file'}],v=>{ if(!v.name.trim())return; const av=(v.avatar&&v.avatar.indexOf('data:image')===0)?v.avatar:''; S.family.push({name:v.name.trim(),role:v.role||'成员',emoji:v.emoji||'🧑',avatar:av}); saveState(); renderFamily(); }); }
function backupData(){
  const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'hello_kitty_backup_'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('已导出备份文件');
}
function restoreData(){ const f = $('restoreFile'); if (f) f.click(); }
function onRestoreFile(e){
  const file = e.target.files && e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try { const o = JSON.parse(ev.target.result); if (o && o.todos) { S = o; saveState(); ensureFields(); applyTheme(); switchPage('设置'); toast('恢复成功'); } else { alert('数据格式不正确'); } }
    catch(err){ alert('数据格式不正确'); }
  };
  r.readAsText(file); e.target.value = '';
}
function resetData(){ if(confirm('确定恢复默认数据？当前数据会清空。')){ S=JSON.parse(JSON.stringify(DEFAULT)); saveState(); ensureFields(); applyTheme(); switchPage('设置'); } }

/* ============ 想想页 ============ */
function thinkHTML(){
  return '<div class="page-head"><div class="ph-avatar"><svg class="kitty-sticker" width="34" height="34" viewBox="0 0 100 100"><use href="#kitty"/></svg></div><div><h1>想想</h1><p>把灵感都收进来 ♥</p></div></div>'
  + '<div class="card-title" style="margin-bottom:10px"><svg class="kitty-sticker" width="26" height="26" viewBox="0 0 100 100"><use href="#kitty"/></svg>我的卡片<span class="add-circle" onclick="addThink()">+</span></div>'
  + '<div class="search-box" style="margin-bottom:12px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a88b92" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke-linecap="round"/></svg><input id="thinkSearch" type="text" placeholder="搜索标题 / 内容" oninput="renderThink()"></div>'
  + '<div id="thinkList"></div>';
}
function bindThink(){ renderThink(); }
function renderThink(){
  const el=$('thinkList'); if(!el)return;
  const q = ($('thinkSearch') ? $('thinkSearch').value : '').trim().toLowerCase();
  let list = S.thinks.slice();
  if (q) list = list.filter(t => ((t.title||'')+' '+(t.content||'')).toLowerCase().indexOf(q) >= 0);
  if(!list.length){ el.innerHTML='<div class="empty-box"><p>还没有卡片~</p><span>点右上角 + 添加吧</span></div>'; return; }
  el.innerHTML=list.map(t=>'<div class="swipe-item r22"><div class="swipe-del right" onclick="delThink('+t.id+')">删除</div><div class="think-card swipe-body" id="think'+t.id+'" data-id="'+t.id+'" onclick="toggleThink('+t.id+')"><div class="think-head"><span class="t-title">'+escapeHtml(t.title)+'</span><span class="t-date">'+fmtDateCn(t.date)+'</span><span class="t-chev">▾</span></div><div class="think-body" style="display:none">'+(t.photo?'<img src="'+t.photo+'" style="max-width:100%;border-radius:12px;margin-bottom:8px;display:block">':'')+escapeHtml(t.content)+'</div></div></div>').join('');
  attachSwipe('thinkList', -1, b => editThink(+b.dataset.id));
}
function toggleThink(id){ const c=$('think'+id); const b=c.querySelector('.think-body'); const open=c.classList.toggle('open'); b.style.display=open?'block':'none'; }
function addThink(){ openForm('新增卡片',[{key:'title',label:'标题',type:'text',placeholder:'例如 周末计划'},{key:'date',label:'日期',type:'date',value:todayStr()},{key:'content',label:'内容',type:'textarea',placeholder:'写点什么…'},{key:'photo',label:'照片（可选，从相册上传）',type:'file'}],v=>{ if(!v.title.trim())return; S.thinks.unshift({id:Date.now(),title:v.title.trim(),date:v.date,content:v.content||'',photo:(v.photo&&v.photo.indexOf('data:image')===0)?v.photo:''}); saveState(); renderThink(); }); }
function editThink(id){ const t=S.thinks.find(x=>x.id===id); if(!t)return; openForm('编辑卡片',[{key:'title',label:'标题',type:'text',value:t.title},{key:'date',label:'日期',type:'date',value:t.date},{key:'content',label:'内容',type:'textarea',value:t.content||''},{key:'photo',label:'照片（可选，从相册上传）',type:'file'}],v=>{ if(!v.title.trim())return; const ph=(v.photo&&v.photo.indexOf('data:image')===0)?v.photo:(t.photo||''); Object.assign(t,{title:v.title.trim(),date:v.date,content:v.content||'',photo:ph}); saveState(); renderThink(); }); }
function delThink(id){ genericDel(()=>S.thinks, v=>S.thinks=v, id, '已删除卡片', renderThink); }
